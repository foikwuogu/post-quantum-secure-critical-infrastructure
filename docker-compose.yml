services:
  pqc-platform:
    build: .
    container_name: post-quantum-critical-infrastructure
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: sqlite:///./data/pqc.db
      OPENSSL_BIN: openssl
    volumes:
      - pqc-data:/app/data

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: post-quantum-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.3.1
    container_name: post-quantum-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  pqc-data:
  grafana-data:
